<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hermes 通话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: #111118;
  color: #e0e0e0;
  height: 100vh;
  overflow: hidden;
}

/* ── 登录页 ── */
.login-page {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100vh;
  padding: 24px;
}
.login-page h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.login-page p { color: rgba(255,255,255,0.35); font-size: 13px; margin-bottom: 24px; }
.login-box {
  width: 100%;
  max-width: 320px;
  display: flex; flex-direction: column; gap: 12px;
}
.login-box input {
  width: 100%;
  background: #1e1e2a;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px 16px;
  color: #e0e0e0;
  font-size: 15px;
  outline: none;
  transition: border .2s;
}
.login-box input:focus { border-color: rgba(91,78,240,0.4); }
.login-box input::placeholder { color: rgba(255,255,255,0.2); }
.login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #5B4EF0;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}
.login-btn:hover { background: #4a3de0; }
.login-btn:active { transform: scale(0.98); }
.login-error {
  color: #f44336;
  font-size: 13px;
  text-align: center;
  min-height: 20px;
}

/* ── 微信风格布局（登录后） ── */
.app {
  display: none;
  flex-direction: column;
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  border-left: 1px solid rgba(255,255,255,0.04);
  border-right: 1px solid rgba(255,255,255,0.04);
}
.app.show { display: flex; }

@media (max-width: 480px) {
  .app { max-width: 100%; border: none; }
  .topbar { padding: 8px 10px; }
  .topbar h1 { font-size: 15px; }
  .msgs { padding: 8px 10px; }
  .msg .bubble { font-size: 14px; padding: 8px 12px; border-radius: 16px; }
  .input-bar { padding: 5px 8px 7px; }
  .record-btn { width: 32px; height: 32px; font-size: 14px; }
  .input-bar input { font-size: 13px; padding: 7px 12px; }
  .send-btn { width: 32px; height: 32px; font-size: 14px; }
  .login-page h1 { font-size: 24px; }
  .login-box input { padding: 12px 14px; font-size: 14px; }
  .login-btn { padding: 12px; font-size: 14px; }
}

.topbar {
  display: flex; align-items: center;
  padding: 10px 14px;
  background: #1a1a24;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
  gap: 8px;
}
.topbar h1 { font-size: 16px; font-weight: 600; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 6px; }
.net-indicator { display: flex; align-items: center; gap: 3px; font-size: 10px; color: rgba(255,255,255,0.35); }
.net-dot { width: 6px; height: 6px; border-radius: 50%; }
.net-dot.green { background: #4CAF50; }
.net-dot.yellow { background: #FFB74D; }
.net-dot.red { background: #f44336; }
.status-label { font-size: 11px; color: rgba(255,255,255,0.4); }

.msgs {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  scroll-behavior: smooth;
}
.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.msg {
  display: flex;
  margin-bottom: 14px;
  animation: fadeIn .25s ease;
}
.msg.user { justify-content: flex-end; }
.msg.assistant { justify-content: flex-start; }
.msg.system { justify-content: center; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg .bubble-wrap { max-width: 82%; }

.msg .bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.55;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
}
.msg.user .bubble {
  background: #5B4EF0;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.assistant .bubble {
  background: #1e1e2a;
  border: 1px solid rgba(255,255,255,0.06);
  border-bottom-left-radius: 4px;
}
.msg.system .bubble {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.35);
  font-size: 11px;
  text-align: center;
  border-radius: 20px;
  padding: 4px 14px;
}

.input-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px 8px;
  background: #1a1a24;
  border-top: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}

.record-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.6);
  font-size: 16px;
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
}
.record-btn:active { transform: scale(0.92); }
.record-btn.recording { background: #f44336; color: #fff; }

.input-bar input {
  flex: 1;
  background: #262633;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 8px 14px;
  color: #e0e0e0;
  font-size: 14px;
  outline: none;
  transition: border .2s;
  min-width: 0;
}
.input-bar input:focus { border-color: rgba(91,78,240,0.4); }
.input-bar input::placeholder { color: rgba(255,255,255,0.25); }

.send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: #5B4EF0;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.send-btn:active { transform: scale(0.92); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; background: rgba(255,255,255,0.06); }

.recording-hint {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 10;
  display: none;
  backdrop-filter: blur(8px);
}
.recording-hint.show { display: block; animation: fadeIn .2s ease; }


</style>
</head>
<body>
<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <h1>🔐 Hermes</h1>
  <p>请输入访问密码</p>
  <div class="login-box">
    <input type="password" id="loginInput" placeholder="输入密码" autofocus>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn">进入</button>
  </div>
</div>

<!-- 主界面 -->
<div class="app" id="app">
  <div class="topbar">
    <h1>Hermes</h1>
    <div class="topbar-right">
      <div class="net-indicator">
        <span class="net-dot green" id="netDot"></span>
        <span id="netText">网络...</span>
      </div>
      <span class="status-label" id="statusLabel">空闲</span>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="msg system">
      <div class="bubble-wrap">
        <div class="bubble">🎙️ 开始对话吧</div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <button class="record-btn" id="btnRecord" title="按住录音">🎤</button>
    <input type="text" id="inputText" placeholder="输入消息..." maxlength="2000">
    <button class="send-btn" id="btnSend" disabled>➤</button>
  </div>
</div>

<div class="recording-hint" id="recordingHint">🎤 录音中...</div>

<script>
// ══════════════════════════════════════════
// 登录
// ══════════════════════════════════════════
(function(){
  const loginPage = document.getElementById('loginPage');
  const app = document.getElementById('app');
  const loginInput = document.getElementById('loginInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  // 检查是否已登录（sessionStorage）
  if (sessionStorage.getItem('hermes_voice_auth') === '1') {
    loginPage.style.display = 'none';
    app.classList.add('show');
    return;
  }

  function doLogin() {
    const pw = loginInput.value.trim();
    if (!pw) { loginError.textContent = '请输入密码'; return; }

    // 验证密码 → 调用后端
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    })
    .then(r => r.json())
    .then(d => {
      if (d.status === 'ok') {
        sessionStorage.setItem('hermes_voice_auth', '1');
        loginPage.style.display = 'none';
        app.classList.add('show');
        // 加载完成后初始化
        setTimeout(initApp, 100);
      } else {
        loginError.textContent = '密码错误';
        loginInput.value = '';
        loginInput.focus();
      }
    })
    .catch(() => {
      loginError.textContent = '验证服务不可用';
    });
  }

  loginInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  loginBtn.addEventListener('click', doLogin);
  loginInput.focus();
})();

// ══════════════════════════════════════════
// 配置
// ══════════════════════════════════════════
const ASR_URL = '/api/asr';
const CHAT_URL = '/api/chat';
const TTS_URL = '/api/tts';
const TTS_FALLBACK_URL = '/api/tts-fallback';

// ══════════════════════════════════════════
// 录音
// ══════════════════════════════════════════
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isProcessing = false;
let stream = null;

async function startRecording() {
  if (isRecording || isProcessing) return;
  try {
    if (!stream) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    audioChunks = [];
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      isRecording = false;
      document.getElementById('btnRecord').classList.remove('recording');
      document.getElementById('recordingHint').classList.remove('show');
      document.getElementById('statusLabel').textContent = '识别中';
      if (audioChunks.length > 0) sendAudio();
    };
    mediaRecorder.start(250);
    isRecording = true;
    document.getElementById('btnRecord').classList.add('recording');
    document.getElementById('recordingHint').classList.add('show');
    document.getElementById('statusLabel').textContent = '录音中';
  } catch(e) {
    console.error('录音启动失败:', e);
    addSystemMsg('麦克风不可用');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

// 录音按钮
document.getElementById('btnRecord').addEventListener('mousedown', () => {
  startRecording();
});
document.getElementById('btnRecord').addEventListener('mouseup', () => {
  if (isRecording) stopRecording();
});
document.getElementById('btnRecord').addEventListener('mouseleave', () => {
  if (isRecording) stopRecording();
});
document.getElementById('btnRecord').addEventListener('touchstart', (e) => {
  e.preventDefault();
  startRecording();
});
document.getElementById('btnRecord').addEventListener('touchend', (e) => {
  e.preventDefault();
  if (isRecording) stopRecording();
});

async function sendAudio() {
  isProcessing = true;
  try {
    const blob = new Blob(audioChunks, { type: audioChunks[0]?.type || 'audio/webm' });
    let text = '';

    let asrResp = await fetch(ASR_URL, { method: 'POST', body: blob });
    if (!asrResp.ok) { addSystemMsg('ASR 识别失败'); isProcessing = false; return; }
    let asrResult = await asrResp.json();
    text = (asrResult.text || '').trim();
    if (!text) { addSystemMsg('未识别到语音'); isProcessing = false; return; }
    addMsg('user', text, true);

    document.getElementById('statusLabel').textContent = '思考中';
    let chatResp = await fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!chatResp.ok) { addSystemMsg('对话失败'); isProcessing = false; return; }
    let chatResult = await chatResp.json();
    let reply = (chatResult.text || '').trim();
    if (!reply) { addSystemMsg('Hermes 无回复'); isProcessing = false; return; }
    addMsg('assistant', reply);

    document.getElementById('statusLabel').textContent = '播放中';
    try {
      let ttsResp = await fetch(TTS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: reply.substring(0, 200) })
      });
      if (ttsResp.ok && ttsResp.headers.get('content-type')?.startsWith('audio/')) {
        playAudio(await ttsResp.blob());
      } else {
        let fb = await fetch(TTS_FALLBACK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: reply.substring(0, 200) })
        });
        if (fb.ok) playAudio(await fb.blob());
      }
    } catch(e) { console.warn('TTS 失败:', e); }
  } catch(e) { console.error('处理异常:', e); addSystemMsg('处理异常'); }
  isProcessing = false;
  document.getElementById('statusLabel').textContent = '空闲';
}

function playAudio(blob) {
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.onended = () => URL.revokeObjectURL(url);
  audio.play().catch(e => console.warn('播放失败:', e));
}

// ══════════════════════════════════════════
// 文字发送
// ══════════════════════════════════════════
const input = document.getElementById('inputText');
const sendBtn = document.getElementById('btnSend');

input.addEventListener('input', () => {
  sendBtn.disabled = !input.value.trim();
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});
sendBtn.addEventListener('click', sendText);

async function sendText() {
  const text = input.value.trim();
  if (!text || isProcessing) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  isProcessing = true;
  document.getElementById('statusLabel').textContent = '思考中';

  try {
    let chatResp = await fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!chatResp.ok) { addSystemMsg('对话失败'); isProcessing = false; return; }
    let chatResult = await chatResp.json();
    let reply = (chatResult.text || '').trim();
    if (!reply) { addSystemMsg('Hermes 无回复'); isProcessing = false; return; }
    addMsg('assistant', reply);

    document.getElementById('statusLabel').textContent = '播放中';
    try {
      let ttsResp = await fetch(TTS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: reply.substring(0, 200) })
      });
      if (ttsResp.ok && ttsResp.headers.get('content-type')?.startsWith('audio/')) {
        playAudio(await ttsResp.blob());
      } else {
        let fb = await fetch(TTS_FALLBACK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: reply.substring(0, 200) })
        });
        if (fb.ok) playAudio(await fb.blob());
      }
    } catch(e) { console.warn('TTS 失败:', e); }
  } catch(e) { console.error('对话异常:', e); addSystemMsg('对话异常'); }
  isProcessing = false;
  document.getElementById('statusLabel').textContent = '空闲';
}

// ══════════════════════════════════════════
// 消息渲染
// ══════════════════════════════════════════
const msgsEl = document.getElementById('msgs');

function addMsg(role, content, isVoice = false) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let prefix = '';
  if (role === 'user' && isVoice) {
    prefix = '<span style="margin-right:6px;">🎤</span>';
  }
  div.innerHTML = `<div class="bubble-wrap"><div class="bubble">${prefix}${escapeHtml(content)}</div></div>`;
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble-wrap"><div class="bubble">${escapeHtml(text)}</div></div>`;
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ══════════════════════════════════════════
// 网络检测
// ══════════════════════════════════════════
function initApp() {
  checkNet();
  setInterval(checkNet, 15000);
}

async function checkNet() {
  try {
    let r = await fetch('/api/network/config');
    let d = await r.json();
    let mode = d.auto_mode || d.mode || '';
    document.getElementById('netText').textContent = mode === 'office' ? '🏢' : mode === 'home' ? '🏠' : '🌐';
  } catch(e) { document.getElementById('netText').textContent = '⚠️'; }
}
</script>
</body>
</html>
